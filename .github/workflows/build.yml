name: Build NootedAudioFix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable and run
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package Kext
        run: |
          cd build/Release
          zip -r NootedAudioFix-RELEASE.zip NootedAudioFix.kext

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NootedAudioFix-RELEASE
          path: build/Release/NootedAudioFix-RELEASE.zip

